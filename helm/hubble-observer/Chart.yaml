apiVersion: v2
name: hubble-observer
description: A Helm chart for Hubble Observer - A small observability component that monitors network flows within Cilium.
type: application
version: 2.7.0
appVersion: "1.16.4"
keywords:
  - networking
  - observability
  - security
  - cilium
  - hubble
  - kubernetes
  - hubble-observer
sources:
  - https://github.com/onzack/hubble-observer
maintainers:
  - name: ONZACK
    url: https://onzack.com
dependencies:
  # cf2cnp from the fork's Helm repository (GitHub Pages) while onzack/cf2cnp#3 is pending: 0.5.x builds download_url from
  # the proxy headers (or externalURL), accepts many flows per request merged per workload, names policies after the whole
  # selector, carries the selector's labels; 0.6.0 adds cluster-aware selectors (ClusterMesh), L7 rules, the DNS-visibility
  # rule, exclude=, `cf2cnp merge`, allowed origins + a token + a CiliumNetworkPolicy for the pod, and release binaries;
  # 0.6.1 keeps a merged policy file as it was (one rule in a pull request diff) and writes one kube-dns rule; 0.6.3 writes
  # every policy's description from its rules; 0.7.0 consumes Cilium's own policy types (github.com/cilium/cilium
  # pkg/policy/api v1.20.1), validates with the agent's Sanitize plus the CRD, derives the DNS resolver rule from the
  # flows (kube-dns, the CoreDNS Helm chart, NodeLocal, OpenShift) with `dns.profile` / `dns.resolver` as a cluster
  # default, writes fromCIDR for external sources, and adds `validate` and `version`; 0.8.0 the API page (Try it out,
  # the version badge); 0.9.0 structured logging (log/slog, --log-format json|text, --log-level, a request id per line,
  # every refusal logged with its reason) — the chart's deployment passes the two flags, so an older chart with the 0.9.0
  # image logs in text. Upstream: oci://ghcr.io/onzack/helm-charts, version "*" (0.4.0 / binary 0.3.1 today).
  - name: cf2cnp
    version: "0.9.0"
    repository: https://ephico2real2.github.io/cf2cnp
    condition: cf2cnp.enabled
  # Optional companion dashboard: Hubble / Policy Verdicts (Namespace) — audited / forwarded / dropped per namespace from
  # Hubble's `policy` metric, the "observe first, then enforce" picture for the policies generated from these flows.
  # Off by default; needs the policy metric enabled on the agents: https://github.com/ephico2real2/hubble-policy-verdicts
  - name: hubble-policy-verdicts
    alias: policyVerdictsDashboard
    version: "0.4.0"
    repository: https://ephico2real2.github.io/hubble-policy-verdicts
    condition: policyVerdictsDashboard.enabled
